---

# Per-repo configuration for tools/Repo_QA_Checker.
# Windows roles differ structurally from the Linux Ansible-Lockdown roles the checker was written
# against. Everything below narrows the checker to what is meaningful here; it does not lower the
# bar on anything the role is actually expected to satisfy.

# No register_prefixes override is needed. Every register and set_fact in this role uses the
# discovered_ prefix, which is already in the checker's default expected list, so declaring it here
# would be dead config. The control ID is retained after the prefix
# (discovered_au_000583_audit) because stripping it would collapse 134 registers into a handful of
# names, and it keeps registers textually distinct from the wn11_<id> rule toggles.

# No spelling_exceptions are declared because the Spell Check currently reports 0 findings against
# this role. Add Windows vocabulary here only when a real finding calls for it, rather than
# carrying a speculative list.

# Checks with no Windows meaning. Each is structurally inapplicable, not merely noisy:
#   audit_template  - looks for templates/lockdown_audit.yml.j2, which this role does not have
#   audit_vars      - expects the audit_* variable family from vars/audit.yml, which only exists in
#                     roles paired with a goss audit repo. There is no working Windows audit.
#   shell_pipefail  - POSIX 'set -o pipefail' and args.executable; meaningless against
#                     ansible.windows.win_shell
skip_checks:
  - audit_template
  - audit_vars
  - shell_pipefail

# There is no molecule/ directory in a Windows role; CI builds a live Azure instance instead.
fqcn_exclude_paths: []
