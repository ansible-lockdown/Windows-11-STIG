# WN11-AU-000587 and WN11-AU-000588 require the same audit subcategory as WN11-AU-000115 and
# WN11-AU-000110 respectively. V2R9 carries both pairs as separate rule IDs with separate SV-IDs,
# so a scanner checks each one and both have to be implemented. Whichever pair runs first applies
# the setting; the other reads it back and skips, so a converged host reports no change.
