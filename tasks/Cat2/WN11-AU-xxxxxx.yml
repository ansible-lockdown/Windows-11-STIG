          - "{{ 'NT SERVICE\\EventLog does NOT have Full Control' if (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT SERVICE\\EventLog') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) else 'NT SERVICE\\EventLog has Full Control as expected.' }}"
          - ""
          - "═══════════════════════════════════════════════════════════════════"

    - name: "MEDIUM | WN11-AU-000525 | AUDIT | Windows 11 permissions for the System event log must prevent access by non-privileged accounts. | Check for permissions when log location is non-default"
      when:
        - not discovered_au_000525_is_default_location
        - >
          (discovered_au_000525_unauthorized_accounts_with_extra_permissions | length > 0) or
          (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT AUTHORITY\\SYSTEM') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) or
          (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'BUILTIN\\Administrators') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) or
          (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT Service\\Eventlog') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0)
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════════════"
          - "        Windows 11 System Event Log ACL Compliance Check             "
          - "═══════════════════════════════════════════════════════════════════"
          - ""
          - "{{ discovered_au_000525_log_file_path }}"
          - ""
          - "{{ 'No unauthorized accounts detected' if discovered_au_000525_unauthorized_accounts_with_extra_permissions | length == 0 else 'Warning!! Unauthorized Accounts Detected:' }}"
          - "{{ discovered_au_000525_unauthorized_accounts_with_extra_permissions | map(attribute='IdentityReference') | list if discovered_au_000525_unauthorized_accounts_with_extra_permissions | length > 0 else '' }}"
          - ""
          - "Permissions of these unauthorized accounts:"
          - "{{ discovered_au_000525_unauthorized_accounts_with_extra_permissions | map(attribute='FileSystemRights') | list }}"
          - ""
          - "───────────────────────────────────────────────────────────────────"
          - ""
          - "Checking Full Control for required accounts..."
          - ""
          - "{{ 'NT AUTHORITY\\SYSTEM does NOT have Full Control' if (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT AUTHORITY\\SYSTEM') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) else 'NT AUTHORITY\\SYSTEM has Full Control as expected.' }}"
          - "{{ 'BUILTIN\\Administrators does NOT have Full Control' if (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'BUILTIN\\Administrators') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) else 'BUILTIN\\Administrators has Full Control as expected.' }}"
          - "{{ 'NT Service\\Eventlog does NOT have Full Control' if (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT Service\\Eventlog') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) else 'NT Service\\Eventlog has Full Control as expected.' }}"
          - ""
          - "Checking if NT Service\\Eventlog has the correct format for non-default location..."
          - "{{ 'Warning!! NT SERVICE\\EventLog should be listed as NT Service\\Eventlog' if (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT Service\\Eventlog') | list | length == 0) else 'NT Service\\Eventlog is correctly listed as NT Service\\Eventlog.' }}"
          - ""
          - "═══════════════════════════════════════════════════════════════════"

    - name: "MEDIUM | WN11-AU-000525 | AUDIT | Windows 11 permissions for the System event log must prevent access by non-privileged accounts. | Warn Count."
      when: >
        (
          (discovered_au_000525_is_default_location and
          (
            (discovered_au_000525_unauthorized_accounts_with_extra_permissions | length > 0) or
            (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT AUTHORITY\\SYSTEM') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) or
            (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'BUILTIN\\Administrators') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) or
            (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT SERVICE\\EventLog') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0)
          ))
          or
          ((not discovered_au_000525_is_default_location) and
          (
            (discovered_au_000525_unauthorized_accounts_with_extra_permissions | length > 0) or
            (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT AUTHORITY\\SYSTEM') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) or
            (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'BUILTIN\\Administrators') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0) or
            (discovered_au_000525_parsed_acl_entries | selectattr('IdentityReference.Value', 'equalto', 'NT Service\\Eventlog') | selectattr('FileSystemRights', 'equalto', 2032127) | list | length == 0)
          ))
        )
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN11-AU-000525'

- name: "MEDIUM | WN11-AU-000555 | PATCH | Windows 11 must be configured to audit Other Policy Change Events Failures."
  when: wn11_au_000555 | bool
  tags:
    - WN11-AU-000555
    - CAT2
    - CCI-000130
    - SRG-OS-000037-GPOS-00015
    - SV-253344r958412_rule
    - V-253344
    - NIST800-53_AU-3
    - NIST800-53A_AU-3.1
    - NIST800-53R4_AU-3
  block:
    - name: "MEDIUM | WN11-AU-000555 | AUDIT | Windows 11 must be configured to audit Other Policy Change Events Failures. | Get current audit events."
      ansible.windows.win_shell: AuditPol /get /subcategory:"Other Policy Change Events" -r | ConvertFrom-Csv | Select-Object -expand "Inclusion Setting"
      changed_when: false
      failed_when: false
