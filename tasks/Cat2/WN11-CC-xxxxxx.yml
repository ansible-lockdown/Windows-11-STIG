      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name: AllowTelemetry
      register: discovered_cc_000204_telemetry_value

    - name: "MEDIUM | WN11-CC-000204 | PATCH | Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics. | Set Registry If Set To Full."
      when:
