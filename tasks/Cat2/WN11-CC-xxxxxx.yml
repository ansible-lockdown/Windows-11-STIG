- name: "MEDIUM | WN11-CC-000020 | PATCH | IPv6 source routing must be configured to highest protection."
  when: wn11_cc_000020 | bool
  tags:
    - WN11-CC-000020
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253353r991589_rule
    - V-253353
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
    name: DisableIpSourceRouting
    data: 2
    type: dword

- name: "MEDIUM | WN11-CC-000025 | PATCH | The system must be configured to prevent IP source routing."
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    name: DisableIPSourceRouting
    data: 2
    type: dword
  when: wn11_cc_000025 | bool
  tags:
    - WN11-CC-000025
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253354r991589_rule
    - V-253354
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b

- name: "MEDIUM | WN11-CC-000037 | PATCH | Local administrator accounts must have their privileged token filtered to prevent elevated privileges from being used over the network on domain systems."
  when:
    - wn11_cc_000037 | bool
    - discovered_domain_joined | bool
    - not win_skip_for_test
    # Skipped automatically when the run itself is a local account over a network logon
    # transport, because applying this severs that connection. See the note in prelim.yml.
    - not discovered_local_account_network_logon | bool
  tags:
    - WN11-CC-000037
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-253357r958518_rule
    - V-253357
    - NIST800-53_SC-3
    - NIST800-53A_SC-3.1_ii
    - NIST800-53R4_SC-3
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 0
    type: dword

- name: "MEDIUM | WN11-CC-000038 | PATCH | WDigest Authentication must be disabled."
  when: wn11_cc_000038 | bool
  tags:
    - WN11-CC-000038
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-253358r958478_rule
    - V-253358
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest
    name: UseLogonCredential
    data: 0
    type: dword

- name: "MEDIUM | WN11-CC-000039 | PATCH | Run as different user must be removed from context menus."
  when: wn11_cc_000039 | bool
  tags:
    - WN11-CC-000039
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-253359r958478_rule
    - V-253359
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Classes\{{ item }}\shell\runasuser
    name: SuppressionPolicy
    data: 4096
    type: dword
  with_items:
    - batfile
    - cmdfile
    - exefile
    - mscfile

- name: "MEDIUM | WN11-CC-000040 | PATCH | Insecure logons to an SMB server must be disabled."
  when: wn11_cc_000040 | bool
  tags:
    - WN11-CC-000040
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253360r991589_rule
    - V-253360
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation
    name: AllowInsecureGuestAuth
    data: 0
    type: dword

- name: "MEDIUM | WN11-CC-000044 | PATCH | Internet connection sharing must be disabled."
  when: wn11_cc_000044 | bool
  tags:
    - WN11-CC-000044
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-253361r958478_rule
    - V-253361
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections
    name: NC_ShowSharedAccessUI
    data: 0
    type: dword

- name: "MEDIUM | WN11-CC-000050 | PATCH | Hardened UNC Paths must be defined to require mutual authentication and integrity for at least the \\\\*\\SYSVOL and \\\\*\\NETLOGON shares."
  when:
    - wn11_cc_000050 | bool
    - discovered_domain_joined | bool
  tags:
    - WN11-CC-000050
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253362r991589_rule
    - V-253362
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths
    name: "{{ item }}"
    data: RequireMutualAuthentication=1, RequireIntegrity=1
    type: string
  with_items:
    - \\*\SYSVOL
    - \\*\NETLOGON

- name: "MEDIUM | WN11-CC-000052 | PATCH | Windows 11 must be configured to prioritize ECC Curves with longer key lengths first."
  when:
    - wn11_cc_000052 | bool
    - not win_skip_for_test | bool
  tags:
    - WN11-CC-000052
    - CAT2
    - CCI-000803
    - SRG-OS-000120-GPOS-00061
    - SV-253363r971535_rule
    - V-253363
    - NIST800-53_IA-7
    - NIST800-53A_IA-7.1
    - NIST800-53R4_IA-7
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002
    name: EccCurves
    data: NistP384 NistP256
    type: multistring

- name: "MEDIUM | WN11-CC-000055 | PATCH | Simultaneous connections to the internet or a Windows domain must be limited."
  when: wn11_cc_000055 | bool
  tags:
    - WN11-CC-000055
    - CAT2
    - CCI-002418
    - SRG-OS-000481-GPOS-00481
    - SV-253364r958358_rule
    - V-253364
    - NIST800-53R4_SC-8
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy
    name: fMinimizeConnections
    data: 3
    type: dword

- name: "MEDIUM | WN11-CC-000060 | PATCH | Connections to non-domain networks when connected to a domain authenticated network must be blocked."
  when:
    - wn11_cc_000060 | bool
    - discovered_domain_joined | bool
  tags:
    - WN11-CC-000060
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253365r991589_rule
    - V-253365
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy
    name: fBlockNonDomain
    data: 1
    type: dword

# This functionality has been removed in Windows 11 v1803 and newer and is not applicable to those newer versions
# Add the following to the when statement for Windows 11 ansible_facts['distribution_version'] <= "10.0.1803.0"
- name: "MEDIUM | WN11-CC-000066 | PATCH | Command line data must be included in process creation events."
  when: wn11_cc_000066 | bool
  tags:
    - WN11-CC-000066
    - CAT2
    - CCI-000135
    - SRG-OS-000042-GPOS-00020
    - SV-253367r958422_rule
    - V-253367
    - NIST800-53_AU-3_1
    - NIST800-53A_AU-3_1.1_ii
    - NIST800-53R4_AU-3_1
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword

# This control is not applicable to Windows 11 version 1507 and 1607
# Add the following to the when statement for Windows 11
#     - ansible_facts['distribution_version'] != "10.0.1507.0" or
#       ansible_facts['distribution_version'] != "10.0.1607.0"
- name: "MEDIUM | WN11-CC-000068 | PATCH | Windows 11 must be configured to enable Remote host allows delegation of non-exportable credentials."
  when: wn11_cc_000068 | bool
  tags:
    - WN11-CC-000068
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253368r991589_rule
    - V-253368
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation
    name: AllowProtectedCreds
    data: 1
    type: dword

- name: "MEDIUM | WN11-CC-000070 | PATCH | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection."
  # The V2R9 title, check text and fix text contain no reference to virtual desktops. The gate
  # therefore skipped this control on any host the VDI heuristic matched, which before this
  # cycle included ordinary Azure and Hyper-V guests. Only the three controls whose check text
  # grants the exemption keep it.
  when: wn11_cc_000070 | bool
  tags:
    - WN11-CC-000070
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253369r1210289_rule
    - V-253369
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "MEDIUM | WN11-CC-000070 | PATCH | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Set virtualization-based Security enabled."
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: EnableVirtualizationBasedSecurity
        data: 1
        type: dword

    - name: "MEDIUM | WN11-CC-000070 | PATCH | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Set Variable For Secure Boot."
      when: win11stig_enable_virtualization_based_security == 1 or win11stig_enable_virtualization_based_security == 3
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: RequirePlatformSecurityFeatures
        data: "{{ win11stig_enable_virtualization_based_security }}"
        type: dword

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warning Check For Variable Standards."
      when:
        - win11stig_enable_virtualization_based_security != 1
        - win11stig_enable_virtualization_based_security != 3
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid setting for win11stig_enable_virtualization_based_security. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warning Count."
      when:
        - win11stig_enable_virtualization_based_security != 1
        - win11stig_enable_virtualization_based_security != 3
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN11-CC-000070'

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check Secure Boot status"
      ansible.windows.win_shell: Confirm-SecureBootUEFI
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_secure_boot_status

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check Virtualization-Based Security (VBS) status"
      ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).VirtualizationBasedSecurityStatus
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_vbs_status

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check if Device Guard is running"
      ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).SecurityServicesRunning
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_device_guard_status

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check if Hyper-V is installed"
      ansible.windows.win_shell: Get-WindowsOptionalFeature -FeatureName Microsoft-Hyper-V-All -Online | Select-Object -ExpandProperty State
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_hyper_v_status

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Check if CPU supports DMA Protection (IOMMU)"
      ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).AvailableSecurityProperties
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000070_dma_protection_status

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Display results and warnings"
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - "   Virtualization-Based Security (VBS) Check Results   "
          - "═══════════════════════════════════════════════════════"
          - "Secure Boot Enabled   : {{ 'Yes' if discovered_cc_000070_secure_boot_status.stdout == 'True' else 'No (Finding)' }}"
          - "VBS Running           : {{ 'Yes' if discovered_cc_000070_vbs_status.stdout | int == 2 else 'No (Finding)' }}"
          - "Device Guard Running  : {{ 'Yes' if '1' in discovered_cc_000070_device_guard_status.stdout else 'No (Finding)' }}"
          - "Hyper-V Installed     : {{ 'Yes' if 'Enabled' in discovered_cc_000070_hyper_v_status.stdout else 'No (Finding)' }}"
          - "DMA Protection        : {{ 'Yes' if '3' in discovered_cc_000070_dma_protection_status.stdout else 'No (Hardware Limitation?)' }}"
          - "═══════════════════════════════════════════════════════"

    - name: "MEDIUM | WN11-CC-000070 | AUDIT | Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warning Count."
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: 'WN11-CC-000070'

- name: "MEDIUM | WN11-CC-000080 | PATCH | Virtualization-based protection of code integrity must be enabled."
  # The V2R9 title, check text and fix text contain no reference to virtual desktops. The gate
  # therefore skipped this control on any host the VDI heuristic matched, which before this
  # cycle included ordinary Azure and Hyper-V guests. Only the three controls whose check text
  # grants the exemption keep it.
