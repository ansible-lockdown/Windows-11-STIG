- name: "MEDIUM | WN11-CC-000252 | PATCH | Windows 11 must be configured to disable Windows Game Recording and Broadcasting."
  when:
    - wn11_cc_000252 | bool
    - not (discovered_displayversion.exists | default(false) and discovered_displayversion.value is search("LTSC"))
  tags:
    - WN11-CC-000252
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-253399r1256682_rule
    - V-253399
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  # The check text names \SOFTWARE\Microsoft\PolicyManager\current\device\ApplicationManagement.
  # The role previously wrote AllowGameDVR under \SOFTWARE\Policies\Microsoft\Windows\GameDVR,
  # which is a different key, so the control was reported as remediated while the value a scanner
  # reads was never set.
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\PolicyManager\current\device\ApplicationManagement
    name: AllowGameDVR
    data: 0
    type: dword

# The check text makes this NA only for virtual desktops that are deleted or refreshed on
# logoff, so the exemption is the non-persistent case. Gating on discovered_vdi_persistent
# instead excluded physical hosts, which the STIG does not exempt, and that fact could never be
# raised anyway, so this control applied nowhere. The `not discovered_vdi_non_persistent` form
# is the idiom already used by six other controls in this role.
