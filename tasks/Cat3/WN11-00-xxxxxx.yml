---

- name: "LOW | WN11-00-000065 | AUDIT | Unused accounts must be disabled or removed from the system after 35 days of inactivity."
  when: wn11_00_000065 | bool
  tags:
    - WN11-00-000065
    - CAT3
    - CCI-000172
    - CCI-000795
    - CCI-003627
    - SRG-OS-000468-GPOS-00212
    - SV-253268r1051039_rule
    - V-253268
    - NIST800-53_AU-12_c
    - NIST800-53A_AU-12.1_iv
    - NIST800-53R4_AU-12_c
    - NIST800-53_IA-4_e
    - NIST800-53A_IA-4.1_iii
    - NIST800-53R4_IA-4_e
  block:
    - name: "LOW | WN11-00-000065 | AUDIT | Unused accounts must be disabled or removed from the system after 35 days of inactivity. | Powershell To Get Accounts."
      ansible.windows.win_shell: Get-LocalUser | Where-Object {$_.Lastlogon -le (Get-Date).AddDays(-35)} | Select-Object Name, Enabled, Lastlogon | Format-Table -AutoSize
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000065_user_local_accounts

    - name: "LOW | WN11-00-000065 | AUDIT | Unused accounts must be disabled or removed from the system after 35 days of inactivity. | Print Results."
      ansible.builtin.debug:
        msg:
          - "Warning!! Review the list below and make sure it meets site policies."
          - "The list below includes all accounts that have not been logged into for the last 35 days, those unused accounts"
          - "must be disabled or removed from the system after 35 days of inactivity per STIG."
          - "Inactive accounts that have been reviewed and deemed to be required must be documented with the ISSO.."
          - "{{ discovered_00_000065_user_local_accounts.stdout_lines }}"

    - name: "LOW | WN11-00-000065 | AUDIT | Unused accounts must be disabled or removed from the system after 35 days of inactivity. | Warn Count."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN11-00-000065'

- name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain."
  when:
    - wn11_00_000085 | bool
    - discovered_domain_joined | bool
  tags:
    - WN11-00-000085
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253272r1210286_rule
    - V-253272
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Verify allowed built-in accounts are disabled"
      ansible.windows.win_shell: |
        $allowedBuiltIn = @("Administrator", "Guest", "DefaultAccount", "defaultuser0", "WDAGUtilityAccount")
        $results = @()
        foreach ($acct in $allowedBuiltIn) {
          $user = Get-LocalUser -Name $acct -ErrorAction SilentlyContinue
          if ($user) {
            if (-not $user.Disabled) {
              $results += [pscustomobject]@{
                Name    = $acct
                Issue   = "Built-in account is enabled"
                Enabled = $true
              }
            }
            else {
              $results += [pscustomobject]@{
                Name    = $acct
                Issue   = "Built-in account is disabled"
                Enabled = $false
              }
            }
          }
          else {
            $results += [pscustomobject]@{
              Name    = $acct
              Issue   = "Account not found"
              Enabled = $null
            }
          }
        }
        $results | ConvertTo-Json
      changed_when: false
      check_mode: false
      register: discovered_00_000085_built_in_check

    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Set fact for built-in accounts check results."
      ansible.builtin.set_fact:
        discovered_00_000085_built_in_accounts: "{{ discovered_00_000085_built_in_check.stdout | from_json }}"

    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Find non-allowed local accounts."
      ansible.windows.win_shell: |
        $allowedBuiltIn = @("Administrator", "Guest", "DefaultAccount", "defaultuser0", "WDAGUtilityAccount")
        $localAdmins = Get-LocalGroupMember -Group "Administrators" |
                       Where-Object { $_.objectClass -eq "User" } |
                       Select-Object -ExpandProperty Name
        $results = @()
        $allUsers = Get-LocalUser
        foreach ($user in $allUsers) {
          if (($allowedBuiltIn -notcontains $user.Name) -and ($localAdmins -notcontains $user.Name)) {
             $results += [pscustomobject]@{
                Name    = $user.Name
                Issue   = "Account is not allowed"
                Enabled = -not $user.Disabled
             }
          }
        }
        $results | ConvertTo-Json
      changed_when: false
      check_mode: false
      register: discovered_00_000085_disallowed_check

    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Set fact for disallowed accounts check results."
      ansible.builtin.set_fact:
        discovered_00_000085_non_allowed_accounts: "{{ discovered_00_000085_disallowed_check.stdout | from_json }}"

    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Set compliance status fact based on local accounts checks."
      ansible.builtin.set_fact:
        discovered_00_000085_local_accounts_compliant: >-
          {{
            (discovered_00_000085_built_in_accounts | selectattr('Issue', 'equalto', 'Built-in account is disabled') | list | length == discovered_00_000085_built_in_accounts | length)
            and
            (
              (discovered_00_000085_non_allowed_accounts is mapping and discovered_00_000085_non_allowed_accounts | length == 0)
              or
              (discovered_00_000085_non_allowed_accounts is sequence and discovered_00_000085_non_allowed_accounts | length == 0)
            )
          }}

    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Verify local account compliance and display results"
      when: not discovered_00_000085_local_accounts_compliant
      ansible.builtin.debug:
        msg: >-
          [
            "═══════════════════════════════════════════════════════════════════════════════════",
            "                 Local Account Compliance Check - Domain Connected                 ",
            "═══════════════════════════════════════════════════════════════════════════════════",
            "",
            "Built-in Accounts Status:",
            "",
            {% for acct in discovered_00_000085_built_in_accounts %}
            "  {{ acct.Name }} - {{ acct.Issue }} (Enabled: {{ acct.Enabled }})",
            {% endfor %}
            "───────────────────────────────────────────────────────────────────────────────────",
            "",
            "Disallowed Accounts:",
            "",
            {% if discovered_00_000085_non_allowed_accounts is mapping %}
            "  {{ discovered_00_000085_non_allowed_accounts.Name }} - {{ discovered_00_000085_non_allowed_accounts.Issue }} (Enabled: {{ discovered_00_000085_non_allowed_accounts.Enabled }})",
            {% elif discovered_00_000085_non_allowed_accounts | length > 0 %}
              {% for acct in discovered_00_000085_non_allowed_accounts %}
            "  {{ acct.Name }} - {{ acct.Issue }} (Enabled: {{ acct.Enabled }})",
              {% endfor %}
            {% else %}
            "  No disallowed accounts found.",
            {% endif %}
            "",
            "───────────────────────────────────────────────────────────────────────────────────",
            "",
            {% if (discovered_00_000085_built_in_accounts | selectattr('Issue', 'equalto', 'Built-in account is disabled') | list | length == discovered_00_000085_built_in_accounts | length) and ((discovered_00_000085_non_allowed_accounts is mapping and discovered_00_000085_non_allowed_accounts | length == 0) or (discovered_00_000085_non_allowed_accounts is sequence and discovered_00_000085_non_allowed_accounts | length == 0)) %}
            "COMPLIANCE STATUS: COMPLIANT — All built-in accounts are disabled and no disallowed accounts found.",
            {% else %}
            "COMPLIANCE STATUS: Warning!! NON-COMPLIANT — Issues detected with local accounts.",
            {% endif %}
            "",
            "═══════════════════════════════════════════════════════════════════════════════════"
          ]

    - name: "LOW | WN11-00-000085 | AUDIT | Standard local user accounts must not exist on a system in a domain. | Warn Count."
      when: not discovered_00_000085_local_accounts_compliant
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN11-00-000085'

- name: "LOW | WN11-00-000260 | PATCH | The Windows 11 time service must synchronize with an appropriate DoW time source."
  when:
    - wn11_00_000260 | bool
    - discovered_domain_joined | bool
  tags:
    - WN11-00-000260
    - CAT3
    - CCI-001891
    - CCI-004923
    - SRG-OS-000355-GPOS-00143
    - SV-253296r1256651_rule
    - V-253296
    - NIST800-53R4_AU-8_1_a
  block:
    - name: "LOW | WN11-00-000260 | AUDIT | The Windows 11 time service must synchronize with an appropriate DoW time source. | Check if the system is a Domain Controller"
      ansible.windows.win_shell: Get-ADDomainController -Filter * | Select-Object -ExpandProperty Name
      failed_when: false
      changed_when: false
      check_mode: false
      register: discovered_00_000260_domain_controllers

    - name: "LOW | WN11-00-000260 | AUDIT | The Windows 11 time service must synchronize with an appropriate DoW time source. | Check if the system holds the PDC Emulator role"
      ansible.windows.win_shell: "(Get-ADDomain | Select-Object -ExpandProperty PDCEmulator)"
      failed_when: false
      changed_when: false
      check_mode: false
      register: discovered_00_000260_pdc_emulator

    - name: "LOW | WN11-00-000260 | AUDIT | The Windows 11 time service must synchronize with an appropriate DoW time source. | Check current Windows Time Service configuration"
      ansible.windows.win_shell: W32tm /query /configuration
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000260_time_config

    - name: "LOW | WN11-00-000260 | PATCH | The Windows 11 time service must synchronize with an appropriate DoW time source. | Ensure Windows Time Service is using NT5DS for domain-joined systems (excluding PDC Emulator)"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
        name: Type
        data: NT5DS
        type: string
      when:
        - "'NT5DS' not in discovered_00_000260_time_config.stdout"
        - discovered_domain_joined | bool
        - "inventory_hostname not in discovered_00_000260_domain_controllers.stdout_lines"
        - "inventory_hostname != discovered_00_000260_pdc_emulator.stdout.strip()"

    - name: "LOW | WN11-00-000260 | PATCH | The Windows 11 time service must synchronize with an appropriate DoW time source. | Enable Windows NTP"
      when: not discovered_domain_joined | bool
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient
        name: Enabled
        data: 1
        type: dword

    - name: "LOW | WN11-00-000260 | PATCH | The Windows 11 time service must synchronize with an appropriate DoW time source. | Set NtpServer to an Authorized DoW Time Server"
      when: not discovered_domain_joined | bool
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient
        name: NtpServer
        data: "{{ win11stig_ntp_server }}"
        type: string
