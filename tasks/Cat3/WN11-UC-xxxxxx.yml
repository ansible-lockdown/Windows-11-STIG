---

- name: "LOW | WN11-UC-000015 | PATCH | Toast notifications to the lock screen must be turned off."
  when:
    - wn11_uc_000015 | bool
    - discovered_hku_loaded_list | default([]) | length > 0
  tags:
    - WN11-UC-000015
    - CAT3
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-253477r958478_rule
    - V-253477
    - NIST800-53_CM-7
    - NIST800-53A_CM-7.1_ii
    - NIST800-53R4_CM-7_a
  ansible.windows.win_regedit:
    path: HKU:\{{ item }}\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications
    name: NoToastApplicationNotificationOnLockScreen
    data: 1
    type: dword
  loop: "{{ discovered_hku_loaded_list }}"
