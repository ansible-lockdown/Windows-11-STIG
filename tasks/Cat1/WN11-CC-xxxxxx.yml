---

- name: "HIGH | WN11-CC-000075 | PATCH | Credential Guard must be running on Windows 11 systems."
  # The V2R9 title, check text and fix text contain no reference to domain membership,
  # so this applied to standalone systems too; the previous gate skipped it there.
  # The V2R9 title, check text and fix text contain no reference to virtual desktops. The gate
  # therefore skipped this control on any host the VDI heuristic matched, which before this
  # cycle included ordinary Azure and Hyper-V guests. Only the three controls whose check text
  # grants the exemption keep it.
  when: wn11_cc_000075 | bool
  tags:
    - WN11-CC-000075
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-253370r1210290_rule
    - V-253370
    - NIST800-53_CM-6_b
    - NIST800-53A_CM-6.1_iv
    - NIST800-53R4_CM-6_b
  block:
    - name: "HIGH | WN11-CC-000075 | PATCH | Credential Guard must be running on Windows 11 systems. | Patch Registry."
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: LsaCfgFlags
        data: 1
        type: dword

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Check if Credential Guard is running via DeviceGuard"
      ansible.windows.win_shell: Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard | Select-Object -ExpandProperty SecurityServicesRunning
      check_mode: false
      register: discovered_cc_000075_credential_guard_status
      changed_when: false
      failed_when: false

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Check if Credential Guard is listed in System Information"
      ansible.windows.win_shell: systeminfo | findstr /C:"Credential Guard"
      check_mode: false
      register: discovered_cc_000075_systeminfo_status
      changed_when: false
      failed_when: false

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Check if Secure Boot is enabled"
      ansible.windows.win_shell: Confirm-SecureBootUEFI
      check_mode: false
      register: discovered_cc_000075_secure_boot_status
      changed_when: false
      failed_when: false

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Check if TPM is enabled"
      ansible.windows.win_shell: "(Get-WmiObject -Namespace 'Root\\CIMv2\\Security\\MicrosoftTpm' -Class Win32_Tpm).Enabled"
      check_mode: false
      register: discovered_cc_000075_tpm_status
      changed_when: false
      failed_when: false

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Check if Hyper-V is enabled"
      ansible.windows.win_shell: systeminfo | findstr /C:"Hyper-V Requirements"
      check_mode: false
      register: discovered_cc_000075_hyper_v_status
      changed_when: false
      failed_when: false

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Credential Guard and System Security Check Summary."
      ansible.builtin.debug:
        msg:
          - "==== Credential Guard Audit Summary ===="
          - "Credential Guard (DeviceGuard Check): {{ 'Running' if '1' in discovered_cc_000075_credential_guard_status.stdout else 'NOT Running (Finding)' }}"
          - "Credential Guard (System Information Check): {{ discovered_cc_000075_systeminfo_status.stdout_lines if discovered_cc_000075_systeminfo_status.stdout_lines else 'Credential Guard NOT found (Finding)' }}"
          - "Secure Boot: {{ 'Enabled' if discovered_cc_000075_secure_boot_status.stdout == 'True' else 'NOT Enabled (Finding)' }}"
          - "TPM: {{ 'Enabled' if discovered_cc_000075_tpm_status.stdout == 'True' else 'NOT Enabled (Finding)' }}"
          - "Hyper-V: {{ discovered_cc_000075_hyper_v_status.stdout_lines if discovered_cc_000075_hyper_v_status.stdout_lines else 'Hyper-V NOT supported or enabled (Finding)' }}"
          - "====================================="
          - "If any of the above checks indicate (Finding), remediation is required."

    - name: "HIGH | WN11-CC-000075 | AUDIT | Credential Guard must be running on Windows 11 systems. | Warn Count."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'WN11-CC-000075'

- name: "HIGH | WN11-CC-000155 | PATCH | Solicited Remote Assistance must not be allowed."
  when: wn11_cc_000155 | bool
  tags:
    - WN11-CC-000155
    - CAT1
    - CCI-001090
    - SRG-OS-000138-GPOS-00069
    - SV-253382r1137695_rule
    - V-253382
    - NIST800-53_SC-4
    - NIST800-53A_SC-4.1
    - NIST800-53R4_SC-4
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
    name: fAllowToGetHelp
    data: 0
    type: dword

